services:
  # ========================================
  # 智能电网负荷预测API服务
  # ========================================
  smartgrid-api:
    build:
      context: .
      dockerfile: docker/services/api-gateway/Dockerfile
    image: smartgrid-prediction:latest
    container_name: smartgrid-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 基础配置
      - SYSTEM_ENVIRONMENT=production
      - API_PORT=8000
      - LOGGING_LEVEL=INFO
      - TZ=Asia/Shanghai

      # 认证与官方实时数据（从项目根 .env 注入，不写入镜像）
      - AUTH_JWT_SECRET_KEY=${AUTH_JWT_SECRET_KEY:-}
      - ISO_NE_USERNAME=${ISO_NE_USERNAME:-}
      - ISO_NE_PASSWORD=${ISO_NE_PASSWORD:-}
      
      # 数据库配置 (MySQL)
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-OOOO}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-changeme}
      - MYSQL_POOL_SIZE=10
      
      # Redis配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      
      # GPU配置
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      
      # 性能优化配置
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - MAX_WORKERS=8
      - BATCH_SIZE=16
      - CACHE_TTL=300
      
    volumes:
      # 模型权重（训练产物，只读）
      - ./backend/models:/app/backend/models:ro
      # 日志（可写）
      - ./logs:/app/backend/logs
      # 配置（只读，覆盖镜像内同名文件）
      - ./backend/config:/app/backend/config:ro
      # 后端代码（开发热更新；镜像已 COPY 相同内容）
      - ./backend:/app/backend:ro
      # 数据目录（只读）
      - ./data:/app/data:ro
    
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          cpus: '2.0'
          memory: 1G
    
    networks:
      - smartgrid-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================
  # MySQL数据库
  # ========================================
  mysql:
    image: mysql:8.0
    container_name: smartgrid-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-OOOO}
      TZ: Asia/Shanghai
    
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    
    ports:
      - "3306:3306"
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --explicit_defaults_for_timestamp=1
      --default-time-zone=+08:00
    
    networks:
      - smartgrid-network

  # ========================================
  # Redis缓存服务
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: smartgrid-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
    
    volumes:
      - redis-data:/data
    
    ports:
      - "6379:6379"
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 600M
    
    networks:
      - smartgrid-network

  # ========================================
  # Prometheus监控
  # ========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: smartgrid-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    
    networks:
      - smartgrid-network

  # ========================================
  # Grafana可视化仪表板
  # ========================================
  grafana:
    image: grafana/grafana:latest
    container_name: smartgrid-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123_change_me
      - GF_INSTALL_PLUGINS=redis-datasource,grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_USERS_ALLOW_SIGN_UP=false
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    
    depends_on:
      - prometheus
      - redis
    
    networks:
      - smartgrid-network

  # ========================================
  # Node Exporter (系统监控)
  # ========================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: smartgrid-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    
    networks:
      - smartgrid-network

  # ========================================
  # cAdvisor (容器监控)
  # ========================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: smartgrid-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    
    networks:
      - smartgrid-network

# ========================================
# 网络配置
# ========================================
networks:
  smartgrid-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ========================================
# 数据卷配置
# ========================================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
