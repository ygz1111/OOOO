name: 智能电网负荷预测系统 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-unit:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-asyncio pytest-mock
          python -m pip install -r backend/requirements.txt

      - name: 生成隔离测试配置
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets
          Path('.env').write_text(
              'SYSTEM_ENVIRONMENT=testing\nAUTH_JWT_SECRET_KEY=' + secrets.token_hex(32) + '\n',
              encoding='utf-8',
          )
          PY

      - name: 运行单元测试
        working-directory: backend
        run: |
          python -m pytest tests/ -v --tb=short -o addopts= --cov=realtime_api \
            --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=0

      - name: 检查真实覆盖率（保留 80% 门槛）
        working-directory: backend
        run: python -m coverage report --fail-under=80

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: backend/coverage.xml
          retention-days: 7

  security-scan:
    name: 安全检查 (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装 Bandit
        run: python -m pip install bandit

      - name: 运行 Bandit 扫描
        run: bandit -r backend/realtime_api -q || true
        continue-on-error: true

  type-check:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: TypeScript 类型检查
        working-directory: frontend
        run: npm run type-check

      - name: 缓存、认证及页面交互测试
        working-directory: frontend
        run: npm test

      - name: 验证生产构建
        working-directory: frontend
        run: npm run build
