# Prometheus配置文件
# 智能电网负荷预测系统监控配置

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'smartgrid-prediction'
    environment: 'production'

# 告警规则文件
rule_files:
  - '/etc/prometheus/alert_rules.yml'

# 抓取配置
scrape_configs:
  # Prometheus自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # 智能电网API服务监控
  - job_name: 'smartgrid-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['smartgrid-api:8000']
        labels:
          service: 'prediction-api'
          version: 'v2.0'
    
    # 自定义标签
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'smartgrid-api'

  # Node Exporter监控
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system-monitor'

  # cAdvisor容器监控
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'container-monitor'

  # Redis监控
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'cache'

  # PostgreSQL监控 (如果有postgres_exporter)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      # 如果有Alertmanager，取消注释以下配置
      # - targets: ['alertmanager:9093']