# Grafana仪表板配置
apiVersion: 1

providers:
  - name: 'Smart Grid Dashboards'
    orgId: 1
    folder: 'Smart Grid Monitoring'
    folderUid: 'smartgrid'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false