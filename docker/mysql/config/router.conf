# MySQL Router 配置文件 (简化版)
# 实现读写分离

[DEFAULT]
logging_folder=/var/log/mysqlrouter

# 写到master (6447)
[routing:readwrite]
bind_address=0.0.0.0
bind_port=6447
destination=mysql-primary:3306
mode=read-write
protocol=classic
connect_timeout=5
max_connections=1000

# 从slaves读 (6446)
[routing:readonly]
bind_address=0.0.0.0
bind_port=6446
destination=mysql-replica:3306
mode=read-only
max_connections=1000

[logger]
level=INFO