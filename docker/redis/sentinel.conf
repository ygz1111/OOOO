# Redis Sentinel 配置文件
# 实现Redis高可用自动故障转移

# Sentinel port
port 26379

# Daemonize (background process)
daemonize no

# Log file
logfile ""

# 监控的 master 节点
tcp-backlog 511

# PID file
pidfile "/var/run/redis-sentinel.pid"

# 工作目录
dir "/tmp"

# 监控配置
# sentinel monitor <master-name> <ip> <redis-port> <quorum>
sentinel monitor mymaster redis-master 6379 2

# Master 的认证密码
sentinel auth-pass mymaster redis123

# 故障转移超时(毫秒)
sentinel failover-timeout mymaster 180000

# 故障转移时最多有多少个slave同时对新的master进行同步
sentinel parallel-syncs mymaster 1

# Sentinel 之间通信密码(可选，提高安全性)
sentinel announce-ip 0.0.0.0
sentinel announce-port 26379

# Down-after-milliseconds: master多长时间没有响应就认为其宕机
# 此处配置master的响应时间阈值 sentinel down-after-milliseconds mymaster 60000

# Sentinel的选举时间(秒)
sentinel config-epoch mymaster 0
sentinel leader-epoch mymaster 0

# ACL配置(高版本Redis支持)  
# aclfile /etc/redis/users.acl

# 支持的命令
# 禁用危险命令
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command SHUTDOWN "KILL"

# 网络配置
dns-retry 5

# 系统优化
tcp-keepalive 300
