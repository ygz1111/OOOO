# 智能电网负荷预测系统 - 应用配置文件

# ============================================================================
# 系统配置
# ============================================================================
system:
  name: "智能电网负荷预测系统"
  version: "1.1.0"
  environment: "production"  # development, testing, production
  
# ============================================================================
# API服务配置
# ============================================================================
api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  cors_origins: ["*"]
  timeout_seconds: 30
  rate_limit_per_minute: 60
  
# ============================================================================
# 气象数据配置
# ============================================================================
weather:
  # 气象站点统一维护在 locations.yaml（新英格兰 6 城市），此处仅保留 Open-Meteo API 配置
  openmeteo:
    base_url: "https://api.open-meteo.com/v1"
    forecast_days: 2
    past_days: 9  # 168h 模型窗口 + temp_mem 指数记忆热启动
    rate_limit_interval: 1.5
    cache_ttl: 300
    
# ============================================================================
# TensorFlow 模型配置
# ============================================================================
models:
  # 特征工程配置
  feature_engineering:
    lookback_window: 168  # 168小时 = 7天
    feature_dimensions: 38

  # ------------------------------------------------------------------
  # TensorFlow 模型接入 (MMXX 训练产物) 2026-09
  # 资产目录: backend/models/tf_assets/{tf_split_v1,pv_v2}/
  #   (由 scripts/prepare_tf_assets.py 从 MMXX 特征表离线冻结 scaler 生成,
  #    不重新训练; 若资产缺失或加载失败，strict_startup 会阻止后端启动)
  # ------------------------------------------------------------------
  engines:
    load_backend: "tf_split_v1" # tf_split_v1 | tf_v2
    pv_backend: "tf_pv"
    enabled: true
    strict_startup: true        # 所选模型加载失败时明确停止，不进行旧模型回退
    inference_mode: "live"      # live=ISO-NE+Open-Meteo；demo=仅用于冻结样本验收
  tf:
    assets_dir: "models/tf_assets"
    tf_v2:
      weights_path: "models/tf_assets/tf_v2/tf_v2_best.weights.h5"
      scalers_path: "models/tf_assets/tf_v2/scalers.json"
      tail_path: "models/tf_assets/tf_v2/ca_tail.parquet"
    tf_split_v1:
      load_weights_path: "models/tf_assets/tf_split_v1/load_best.weights.h5"
      price_weights_path: "models/tf_assets/tf_split_v1/price_best.weights.h5"
      load_scalers_path: "models/tf_assets/tf_split_v1/load_scalers.json"
      price_scalers_path: "models/tf_assets/tf_split_v1/price_scalers.json"
      feature_tail_path: "models/tf_assets/tf_split_v1/ca_features.parquet"
    pv_tf:
      weights_path: "models/tf_assets/pv_v2/pv_v2_best.weights.h5"
      metadata_path: "models/tf_assets/pv_v2/metadata.json"
      tail_path: "models/tf_assets/pv_v2/pv_tail.parquet"
    
# ============================================================================
# 数据配置
# ============================================================================
data:
  # 归一化配置
  normalization:
    method: "minmax"  # minmax, standard
    feature_range: [0, 1]
    
  # 数据质量阈值
  quality_thresholds:
    temperature_min: -50.0
    temperature_max: 60.0
    humidity_min: 0.0
    humidity_max: 100.0
    wind_speed_min: 0.0
    wind_speed_max: 200.0
    
# ============================================================================
# 光伏发电配置
# ============================================================================
solar:
  installed_capacity_mw: 500.0
  performance_ratio: 0.80
  temperature_coefficient: 0.004  # 温度衰减系数
  reference_temperature: 25.0
  
# ============================================================================
# 监控配置
# ============================================================================
monitoring:
  # 准确性追踪配置
  accuracy:
    window_size: 1000  # 保留最近1000条预测记录
    metrics: ["mape", "rmse", "mae", "r2"]
    
  # 漂移检测配置  
  drift_detection:
    psi_threshold: 0.2  # PSI超过0.2认为有显著漂移
    window_size: 100
    
  # 数据质量监控
  data_quality:
    check_interval_minutes: 15
    alert_threshold: 0.95  # 数据质量低于95%时告警
    
# ============================================================================
# 缓存配置
# ============================================================================
cache:
  redis:
    host: "redis"
    port: 6379
    db: 0
    password: null
    protocol: 2  # RESP2，兼容 Windows Redis 3.x 与 Docker Redis 7
    
  # 缓存策略
  strategies:
    weather_data_ttl: 3600  # 1小时
    prediction_results_ttl: 1800  # 30分钟
    model_cache_ttl: 7200  # 2小时
    
# ============================================================================
# 认证配置
# ============================================================================
auth:
  jwt:
    # 生产环境必须通过环境变量 AUTH_JWT_SECRET_KEY 提供强随机密钥；
    # 该默认值仅作开发兜底，config_manager.get_jwt_secret() 会优先读取环境变量。
    secret_key: "your-secret-key-change-in-production"
    algorithm: "HS256"
    access_token_expire_minutes: 30
    refresh_token_expire_days: 7
    
  # 默认用户角色
  default_roles:
    - name: "admin"
      permissions: ["read", "write", "delete", "admin"]
      
    - name: "analyst"
      permissions: ["read", "write", "export"]
      
    - name: "viewer"
      permissions: ["read"]
      
# ============================================================================
# 数据库配置
# ============================================================================
database:
  mysql:
    host: "mysql"
    port: 3306
    database: "smart_grid_db"
    user: "root"
    password: ""
    pool_size: 20
    pool_recycle: 3600
    connect_timeout: 30
    
# ============================================================================
# 日志配置
# ============================================================================
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file:
    enabled: true
    path: "logs/app.log"
    max_size_mb: 100
    backup_count: 5
  
# ============================================================================
# 备份配置
# ============================================================================
backup:
  mysql:
    enabled: true
    schedule: "0 2 * * *"  # 每天凌晨2点备份
    retention_days: 30
    backup_path: "/backups/mysql"
    
  redis:
    enabled: true
    rdb_save_interval: 3600  # 1小时间隔
    aof_enabled: true
    
# ============================================================================
# 环境变量覆盖说明
# ============================================================================
# 以下环境变量可以覆盖配置文件中的设置:
# - SYSTEM_ENVIRONMENT: 环境 (development/production)
# - API_PORT: API端口
# - MYSQL_HOST / MYSQL_PORT / MYSQL_DATABASE / MYSQL_USER / MYSQL_PASSWORD
# - REDIS_HOST: Redis主机
# - AUTH_JWT_SECRET_KEY: JWT密钥
# - LOGGING_LEVEL: 日志级别
