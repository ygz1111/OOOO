# ============================================================================
# 智能电网负荷预测系统 - 日志配置文件示例
# ============================================================================

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  
  # 控制台输出配置
  console:
    enabled: true
    level: "INFO"
    format: "json"  # json, text
    
  # 文件输出配置  
  file:
    enabled: true
    level: "DEBUG"
    path: "logs/app.log"
    max_size_mb: 100
    backup_count: 5
    format: "json"
    
  # 错误日志专用文件
  error_file:
    enabled: true
    level: "ERROR"
    path: "logs/error.log"
    max_size_mb: 50
    backup_count: 10
    
  # 访问日志专用文件
  access_file:
    enabled: true  
    level: "INFO"
    path: "logs/access.log"
    max_size_mb: 50
    backup_count: 10
    
  # 性能监控日志
  performance_file:
    enabled: true
    level: "INFO"
    path: "logs/performance.log"
    max_size_mb: 30
    backup_count: 5

# ============================================================================
# 日志轮转配置
# ============================================================================
log_rotation:
  check_interval_hours: 1
  compress_old_logs: true
  retention_days: 30
  
# ============================================================================
# 结构化日志字段配置
# ============================================================================
structured_logging:
  include_thread_info: true
  include_process_info: true
  include_caller_info: true
  include_timestamp_utc: true
  
  # 自定义字段
  additional_fields:
    service_name: "smart-grid-prediction"
    service_version: "1.1.0"
    environment: "production"
    
# ============================================================================
# 敏感信息脱敏配置
# ============================================================================
sensitive_data_masking:
  enabled: true
  mask_patterns:
    - pattern: "password=([^&]+)"
      mask: "password=***"
    - pattern: "api_key=([^&]+)" 
      mask: "api_key=***"
    - pattern: "token=([^&]+)"
      mask: "token=***"
      
# ============================================================================
# 日志过滤配置
# ============================================================================
filters:
  # 忽略特定路径的访问日志
  ignore_paths:
    - "/health"
    - "/health/liveness"
    - "/health/readiness"
    - "/favicon.ico"
    
  # 忽略特定日志级别
  min_level_for_file: "DEBUG"
  min_level_for_console: "INFO"
  
# ============================================================================
# 外部日志系统集成
# ============================================================================
external_logging:
  # ELK Stack 集成
  elasticsearch:
    enabled: false
    hosts: ["http://localhost:9200"]
    index_prefix: "smart-grid-logs"
    
  # Splunk 集成
  splunk:
    enabled: false
    host: "localhost"
    port: 8088
    token: "your-splunk-token"
    
  # AWS CloudWatch 集成
  cloudwatch:
    enabled: false
    region: "us-west-2" 
    log_group: "smart-grid-prediction"
    
  # 自定义日志收集器
  custom_collector:
    enabled: false
    endpoint: "http://localhost:8080/logs"
    batch_size: 100
    flush_interval_seconds: 30