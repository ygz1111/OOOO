services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run deploy/setup_env.py first}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-OOOO}
      MYSQL_USER: ${MYSQL_USER:-smartgrid}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run deploy/setup_env.py first}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    volumes:
      - mysql-data:/var/lib/mysql
      - ../docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 700m
    networks: [smartgrid]
    logging:
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 192m
    networks: [smartgrid]
    logging:
      options:
        max-size: 10m
        max-file: "3"

  smartgrid-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      SYSTEM_ENVIRONMENT: production
      API_PORT: 8000
      LOGGING_LEVEL: INFO
      TZ: Asia/Shanghai
      AUTH_JWT_SECRET_KEY: ${AUTH_JWT_SECRET_KEY:?Run deploy/setup_env.py first}
      ISO_NE_USERNAME: ${ISO_NE_USERNAME:?ISO account required}
      ISO_NE_PASSWORD: ${ISO_NE_PASSWORD:?ISO password required}
      EIA_API_KEY: ${EIA_API_KEY:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-OOOO}
      MYSQL_USER: ${MYSQL_USER:-smartgrid}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_POOL_SIZE: 5
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PROTOCOL: 2
      OMP_NUM_THREADS: 2
      TF_NUM_INTRAOP_THREADS: 2
      TF_NUM_INTEROP_THREADS: 1
      MAX_WORKERS: 4
      CACHE_TTL: 300
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-logs:/app/backend/logs
      - api-cache:/app/backend/cache
    mem_limit: 2300m
    cpus: 2.0
    networks: [smartgrid]
    logging:
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      smartgrid-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 96m
    networks: [smartgrid]
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  smartgrid:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  api-logs:
  api-cache:
